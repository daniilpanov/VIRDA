repos:
  - repo: local
    hooks:
      - id: ruff check
        name: ruff check
        entry: uv run --active ruff check --fix
        language: system
        types: [ python ]
        pass_filenames: true
      - id: ruff format
        name: ruff format
        entry: uv run --active ruff format
        language: system
        types: [ python ]
        pass_filenames: true
      - id: mypy
        name: mypy
        entry: uv run --active mypy src/ tests/
        language: system
        types: [ python ]
        pass_filenames: false
