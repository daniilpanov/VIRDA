[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virda-gui"
version = "0.1.0"
description = "Interactive GUI and viewers for VIRDA electrode localization"
requires-python = ">=3.14"
dependencies = [
    "nibabel>=5.0",
    "numpy>=2.5.2",
    "pyvista>=0.44",
    "trimesh>=5.0.0",
    "ttkbootstrap>=1.10",
    "virda",
]

[project.scripts]
virda-gui = "virda_gui.app:main"
virda-gui-viewer = "virda_gui.viewer:main"
virda-gui-html = "virda_gui.html_export:main"

[tool.uv.sources]
virda = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/virda_gui"]
