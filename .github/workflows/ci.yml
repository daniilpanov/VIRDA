name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Reject all old actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # JOB 1: Linting
  # ========================================
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: ./.github/actions/setup-python-uv
        with:
          uv-version: latest

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml') }}-
            ${{ runner.os }}-mypy-

      - name: Install dependencies
        run: uv sync --all-extras --all-packages --frozen

      - name: Check code formatting (black)
        run: uv run pre-commit run --all-files

  # ========================================
  # JOB 2: Tests with coverage
  # ========================================
  test:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Python tests
        uses: ./.github/actions/python-test
        with:
          python-version: "3.14"
          uv-version: latest
          test-command: |
            uv run pytest tests/ \
              -v \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov \
              --junitxml=junit.xml
          coverage: true
          junit: true

  # ========================================
  # JOB 3: Integration test (push only)
  # ========================================
  integration-test:
    name: Integration Test (mne-sample)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: ./.github/actions/setup-python-uv
        with:
          uv-version: latest

      - name: Install Qt system libraries
        uses: ./.github/actions/install-qt-libs

      - name: Install dependencies
        run: uv sync --all-extras --all-packages --frozen

      - name: Run E2E integration test
        run: |
          uv run pytest tests/test_stage3_e2e.py \
            -v --run-integration --tb=long \
            -n auto \
            -s \
            --junitxml=integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results
          path: integration.xml
          retention-days: 7
