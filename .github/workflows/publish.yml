name: Publish Python Packages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

# Upload artifacts and attach them to GitHub Releases
jobs:
  # ========================================
  # JOB 1: Build sdist + wheel
  # ========================================
  build:
    name: Build VIRDA package (sdist + wheel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Smoke-test entry points
        run: |
          uv sync --all-extras --all-packages --frozen
          uv run virda --help
          uv run virda-gui --help

      - name: Build packages
        run: |
          uv build
          uv build -p virda-gui --out-dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: virda-dist
          path: dist/
          if-no-files-found: error

  # ========================================
  # JOB 2: Attach artifacts to GitHub Release
  # ========================================
  release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: virda-dist
          path: dist/

      - name: Upload assets to GitHub Release
        run: gh release upload --clobber "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/*.whl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
