name: Build Executables

on:
  release:
    types: [published]

  workflow_dispatch:

# Least privilege by default; the release job grants write where needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Test gate: do not build release executables from failing code
  # ========================================
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen --all-packages --all-extras

      - name: Run tests
        run: uv run pytest -q

  # ========================================
  # Linux build (ubuntu-22.04)
  #
  # Pinned to 22.04 rather than latest: the bundled binary links against the
  # runner's glibc, so an older runner produces executables that run on more
  # distributions.
  # ========================================
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-22.04
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies (incl. PyInstaller)
        run: uv sync --frozen --package virda-gui --group build

      - name: Build executable
        run: uv run pyinstaller virda_gui.spec

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: virda-gui-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ========================================
  # Windows build (windows-latest)
  # ========================================
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          version: "0.11.33"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies (incl. PyInstaller)
        run: uv sync --frozen --package virda-gui --group build

      - name: Build executable
        run: uv run pyinstaller virda_gui.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: virda-gui-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ========================================
  # Attach executables to GitHub Release
  # ========================================
  release:
    name: Attach executables to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: virda-gui-linux-x64
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: virda-gui-windows-x64
          path: artifacts/windows

      - name: Upload executables to GitHub Release
        run: |
          mv artifacts/linux/virda virda-linux-x64
          mv artifacts/windows/virda.exe virda-windows-x64.exe
          gh release upload --clobber "$RELEASE_TAG" virda-linux-x64 virda-windows-x64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
