name: Build Executables

on:
  release:
    types: [published]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================
  # Linux build (ubuntu-latest)
  # ========================================
  build-linux:
    name: Build Linux executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project dependencies
        run: uv sync --frozen --package virda-gui

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: uv run pyinstaller virda_gui.spec

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: virda-gui-linux-x64
          path: dist/virda-gui/
          if-no-files-found: error
          retention-days: 30

  # ========================================
  # Windows build (windows-latest)
  # ========================================
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project dependencies
        run: uv sync --frozen --package virda-gui

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: uv run pyinstaller virda_gui.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: virda-gui-windows-x64
          path: dist/virda-gui/
          if-no-files-found: error
          retention-days: 30

  # ========================================
  # Attach executables to GitHub Release
  # ========================================
  release:
    name: Attach executables to GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: virda-gui-linux-x64
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: virda-gui-windows-x64
          path: artifacts/windows

      - name: Create archives
        run: |
          cd artifacts/linux && tar czf ../../virda-gui-linux-x64.tar.gz . && cd ../..
          cd artifacts/windows && 7z a ../../virda-gui-windows-x64.zip . && cd ../..

      - name: Upload assets to GitHub Release
        run: |
          gh release upload --clobber "${{ github.event.release.tag_name }}" \
            virda-gui-linux-x64.tar.gz \
            virda-gui-windows-x64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
