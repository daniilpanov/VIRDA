[project]
name = "virda"
version = "0.1.0"
description = "VIRDA Electrode Localization System"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",  # core package
    "scipy>=1.14",  # core package
    "nibabel>=5.0",  # for NIfTI loader adapter
    "scikit-image>=0.24",  # core package
    "trimesh>=4.0",  # for
    "tqdm>=4.66",  # for progress visualization
    "pydantic>=2.9",  # core package
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pre-commit>=3.8",
]
research = [
    "matplotlib>=3.11.1",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
exclude = "research/"

python_version = "3.14"
incremental = true
strict = true
mypy_path = "src"

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*", "tests"]
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v --cov=src/virda --cov-report=term-missing"
