[project]
name = "virda"
version = "0.1.0"
description = "VIRDA Electrode Localization System"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",  # core package
    "scipy>=1.14",
    "nibabel>=5.0",
    "scikit-image>=0.24",
    "trimesh>=4.0",
    "tqdm>=4.66",
    "pydantic>=2.9",  # core package
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pre-commit>=3.8",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/virda --cov-report=term-missing"